<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kamal Marketing - Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">

  <header class="navbar admin-navbar">
    <div class="container nav-container">
      <div class="logo-area">
        <h1>KAMAL MARKETING <span>(Admin Panel)</span></h1>
      </div>
      <a href="index.html" class="btn btn-secondary" target="_blank">View Live Website</a>
    </div>
  </header>

  <main class="container admin-container">
    <div class="admin-header">
      <h2>Manage Product Catalog</h2>
      <p>Add new products with images from your device, or edit existing ones.</p>
    </div>

    <!-- ADD NEW PRODUCT SECTION -->
    <div class="admin-card add-product-card">
      <h3>➕ Add New Product</h3>
      <form id="add-product-form" onsubmit="addNewProduct(event)">
        <div class="form-group">
          <label>Product Title</label>
          <input type="text" id="new-title" required placeholder="e.g., Star Flex Rolls">
        </div>
        <div class="form-group">
          <label>Upload Product Image (from device)</label>
          <input type="file" id="new-image" accept="image/*" required>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="new-desc" rows="3" required placeholder="Enter product specifications..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Add Product to Catalog</button>
      </form>
    </div>

    <hr style="margin: 40px 0; border: 0; border-top: 1px solid #ddd;">

    <!-- EXISTING / DYNAMIC PRODUCTS CONTAINER -->
    <div id="admin-products-list">
      <!-- JavaScript will dynamically load all products here for editing/deleting -->
    </div>
  </main>

  <script src="admin.js"></script>
</body>
</html>a
